# ============================================================================
# dsh-kassel-boot 的 bundle patch —— 把启动动画挂进 DSH 配置树
# ============================================================================
#
# insert：往配置树里添加一条插件行。
#   id   —— 行标识，必须全局唯一，且与包名一致（patch 定位靠它）
#   name —— 模块名，解析到包入口 lib/index.js（宿主半）
#
# package.json 里声明了 dsh.client，DSH 的模块系统会同时把本包扫描为
# 浏览器插件，向页面提供 /plugins/dsh-kassel-boot/client.js；
# 浏览器半再往 shell.overlay 浮层注册全屏动画。
#
# 注意：插件行那一行（"id: 值"）不要写行尾注释，商城预检的正则会抓不到 entry ID。
# ============================================================================

- insert:
    - id: dsh-kassel-boot
      name: 'dsh-kassel-boot'
